name: flutter_starter
description: Production-shaped Flutter starter — feature-first + Riverpod + go_router.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

# Dependencies are sorted alphabetically (enforced by lint).
dependencies:
  connectivity_plus: ^7.3.1
  dio: ^5.11.0
  drift: 2.34.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  freezed_annotation: ^3.1.0
  go_router: ^17.5.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  logger: ^2.7.0
  riverpod_annotation: ^4.0.3
  shared_preferences: ^2.5.5
  uuid: ^4.6.0

dev_dependencies:
  args: ^2.7.0
  build_runner: ^2.15.1
  crypto: ^3.0.6
  drift_dev: 2.34.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  http_mock_adapter: ^0.6.1
  integration_test:
    sdk: flutter
  json_serializable: ^6.14.1
  mocktail: ^1.0.4
  path: ^1.9.1
  riverpod_generator: ^4.0.4
  very_good_analysis: ^11.0.0
  yaml: ^3.1.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
